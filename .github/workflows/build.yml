name: Build Chess Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S chess_engine_cpp -B chess_engine_cpp/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build chess_engine_cpp/build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chess-engine-windows
        path: chess_engine_cpp/build/Release/chess_engine.exe
