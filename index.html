<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модульные Шахматы</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div id="main-layout">
        <div id="game-area">
            <div class="player-info top-player">
                <div class="player-details">
                    <span class="player-avatar">🤖</span>
                    <span class="player-name" id="top-player-name">Оппонент</span>
                    <div class="captures-row">
                        <span class="captured-pieces" id="top-captured"></span>
                        <span class="material-advantage" id="top-advantage"></span>
                        <span class="accuracy-badge" id="top-accuracy" title="Точность по Stockfish"></span>
                    </div>
                </div>
                <div class="timer" id="top-timer">10:00</div>
            </div>
            
            <div id="board-container">
                <div id="chessboard"></div>
            </div>
            
            <div class="player-info bottom-player">
                <div class="player-details">
                    <span class="player-avatar">👤</span>
                    <span class="player-name" id="bottom-player-name">Вы</span>
                    <div class="captures-row">
                        <span class="captured-pieces" id="bottom-captured"></span>
                        <span class="material-advantage" id="bottom-advantage"></span>
                        <span class="accuracy-badge" id="bottom-accuracy" title="Точность по Stockfish"></span>
                    </div>
                </div>
                <div class="timer" id="bottom-timer">10:00</div>
            </div>
        </div>
        
        <div id="sidebar">
            <div class="sidebar-section settings-section">
                <h2>Настройки</h2>
                
                <div class="setting-group">
                    <label>Режим игры:</label>
                    <div class="toggle-container">
                        <span>Игрок</span>
                        <label class="switch">
                            <input type="checkbox" id="pc-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span>ПК</span>
                    </div>
                </div>

                <div class="setting-group" id="difficulty-container" style="display: none;">
                    <label>Сложность:</label>
                    <select id="difficulty-select" class="styled-select">
                        <option value="1">Легкий</option>
                        <option value="2" selected>Средний</option>
                        <option value="3">Сложный</option>
                        <option value="4">Экстра-сложный</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Анализ игры:</label>
                    <button id="analyze-btn" class="secondary-btn">Анализировать точность</button>
                </div>

                <div class="setting-group">
                    <label>Контроль времени:</label>
                    <select id="time-control" class="styled-select">
                        <option value="0">Без времени</option>
                        <option value="180,2">3 мин + 2 сек</option>
                        <option value="300,0">5 мин</option>
                        <option value="600,0" selected>10 мин</option>
                        <option value="1800,0">30 мин</option>
                        <option value="custom">Свой...</option>
                    </select>
                    <div id="custom-time-inputs" style="display: none; margin-top: 10px; gap: 10px; display: flex;">
                        <input type="number" id="custom-mins" placeholder="Мин" min="1" max="180" class="styled-input" style="width: 50%;">
                        <input type="number" id="custom-inc" placeholder="+Сек" min="0" max="60" class="styled-input" style="width: 50%;">
                    </div>
                </div>

                <div class="setting-group">
                    <label>Стиль доски:</label>
                    <select id="theme-select" class="styled-select">
                        <option value="classic">Классика</option>
                        <option value="ocean">Океан (Синий)</option>
                        <option value="dark">Темный (Серый)</option>
                    </select>
                <button id="reset-btn" class="primary-btn">Новая игра</button>
                <div class="controls-row" style="margin-top: 10px;">
                    <button id="undo-btn" class="btn btn-secondary">Отменить ход</button>
                    <button id="resign-btn" class="btn btn-danger">Сдаться</button>
                </div>
                <button id="draw-btn" class="btn btn-secondary" style="margin-top: 10px; width: 100%; display: none;">Предложить ничью</button>
                <button id="network-btn" class="secondary-btn" style="margin-top: 10px; width: 100%;">Играть по сети</button>
            </div>

            <div class="sidebar-section info-section">
                <div class="status-box">
                    <span id="status">Ход белых</span>
                    <div id="game-info" class="sub-status">Игра началась</div>
                </div>
                
                <button id="analyze-btn" class="primary-btn" style="margin-top: 10px; width: 100%; display: none;">Анализировать партию</button>

                <div id="move-history">
                    <div class="history-header" style="margin-top: 10px;">История ходов</div>
                    <div class="history-container">
                        <ul id="history-list" class="history-list"></ul>
                    </div>
                </div>

                <div id="analysis-panel" class="panel" style="display: none; margin-top: 15px;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1.1em; color: var(--text-color);">Аналитика партии</h3>
                    <div id="analysis-progress" style="margin-bottom: 10px; font-size: 0.9em;"></div>
                    <div id="analysis-advice" style="margin-bottom: 10px; font-weight: bold; color: var(--primary-color);"></div>
                    <div class="history-container" style="max-height: 200px; margin-bottom: 0;">
                        <ul id="analysis-list" class="history-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/logic.js?v=3"></script>
    <script src="js/ai_shared.js?v=3"></script>
    <script src="js/ai_easy.js?v=3"></script>
    <script src="js/ai_medium.js?v=3"></script>
    <script src="js/ai_hard.js?v=3"></script>
    <script src="js/ai_very_hard.js?v=3"></script>
    <script src="js/analysis_manager.js?v=3"></script>
    <script src="js/network.js?v=3"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/transport_socket.js?v=3"></script>
    <script src="js/ui.js?v=3"></script>
</body>
</html>
